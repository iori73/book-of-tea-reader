<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="3000" viewBox="0 0 3000 3000">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="3000" height="3000" fill="#5C7A5E"/>
  <rect width="3000" height="3000" filter="url(#grain)" opacity="0.05"/>

  <!-- tea bowl motif, matching the site's chapter-1 icon -->
  <g transform="translate(1500,1120)">
    <path d="M-620 60h1240c0 340-280 578-620 578S-620 400-620 60Z" fill="#fff"/>
    <ellipse cx="0" cy="60" rx="620" ry="150" fill="#fff" opacity="0.55"/>
    <path d="M-330 60c45-90 120-150 330-150s285 60 330 150" stroke="#5C7A5E" stroke-width="26" stroke-linecap="round" opacity="0.85" fill="none"/>
  </g>

  <text x="1500" y="1980" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="230" fill="#ffffff">The Book of Tea</text>
  <text x="1500" y="2110" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="90" fill="#EFEFE6">茶の本</text>
  <text x="1500" y="2230" text-anchor="middle" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="58" fill="#EFEFE6" opacity="0.85">岡倉覚三 — 村岡博訳 ・ Bilingual Reading</text>
</svg>
